[workspace]
members = [
  "backend/crates/app",
  "backend/apps/api",
  "backend/apps/workflow",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
blake3 = "1.8.2"
chrono = { version = "0.4.42", features = ["serde"] }
diesel = { version = "2.3.12", features = ["postgres", "uuid", "chrono", "serde_json"] }
diesel-async = { version = "0.9.2", features = ["postgres", "bb8"] }
diesel_migrations = "2.3.1"
restate-sdk = "=0.11.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls"] }
schemars = { version = "1.2.0", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net", "fs", "process", "signal"] }
tower-http = { version = "0.6.8", features = ["cors", "fs", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
