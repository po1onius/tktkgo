[project]
name = "tktkgo-cosyvoice-provider"
version = "0.1.0"
description = "tktkgo 本地 CosyVoice 3 口播 Provider"
# CosyVoice 当前验证提交的官方依赖仍以 Python 3.10 为准。这里使用精确的
# Python 次版本约束，避免 uv 自动选择较新的解释器后才在原生扩展处失败。
requires-python = "==3.10.*"
dependencies = [
  "conformer==0.3.2",
  "diffusers==0.29.0",
  "fastapi==0.141.1",
  "fastapi-cli==0.0.4",
  "gdown==5.1.0",
  "gradio==5.4.0",
  "grpcio==1.57.0",
  "grpcio-tools==1.57.0",
  "hydra-core==1.3.2",
  "hyperpyyaml==1.2.3",
  "inflect==7.3.1",
  "librosa==0.10.2",
  "lightning==2.2.4",
  "matplotlib==3.7.5",
  "modelscope==1.20.0",
  "networkx==3.1",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "onnx==1.16.0",
  "onnxruntime==1.18.0",
  "openai-whisper==20231117",
  "protobuf==4.25.0",
  "pyarrow==18.1.0",
  "pydantic==2.13.4",
  "pyworld==0.3.4",
  "rich==13.7.1",
  "setuptools==80.9.0",
  "soundfile==0.12.1",
  "tensorboard==2.14.0",
  "tomli==2.4.1",
  "torch==2.3.1+cpu",
  "torchaudio==2.3.1+cpu",
  "transformers==4.51.3",
  "uvicorn==0.52.3",
  "wetext==0.0.4",
  "wget==3.2",
  "x-transformers==2.11.24",
]

[tool.uv]
package = false

# openai-whisper 20231117 的构建脚本仍导入 pkg_resources。为其隔离构建环境
# 补充最后一个保留该接口的 setuptools 稳定版本，用户无需再分两次安装。
[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools==80.9.0"]

# CPU 环境只允许 torch/torchaudio 从 PyTorch 官方 CPU 索引解析，其他依赖仍
# 使用 PyPI，避免额外索引中同名包影响普通依赖的来源选择。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
